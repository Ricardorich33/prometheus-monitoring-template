groups:
  - name: containers
    rules:
      - alert: ContainerExited
        expr: time() - container_last_seen{name!=""} > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is not running"
          description: "The container has not been seen by cAdvisor for more than 2 minutes."

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name!=""}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted recently"
          description: "The container start time changed in the last 10 minutes."

      - alert: ContainerHighCPU
        expr: sum by (name) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage in container {{ $labels.name }}"
          description: "Container CPU usage has been above 80% for 10 minutes."

      - alert: ContainerHighMemory
        expr: container_memory_working_set_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage in container {{ $labels.name }}"
          description: "Container memory usage is above 90% of its limit."
