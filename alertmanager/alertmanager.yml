route:
  receiver: default
  group_by:
    - alertname
    - cluster
    - env
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default

# Add a real receiver before using this template in production. Example:
#
# receivers:
#   - name: default
#     webhook_configs:
#       - url: https://example.com/alerts
